# Renderiza los videos con Remotion en GitHub, con la voz de Edge TTS (necesita internet), y los sube a videos/render/.
# Se corre solo cuando cambian los guiones, el código de los videos o config.js, o a mano desde la pestaña
# Actions → "Renderizar videos" → Run workflow (ahí se eligen los videos, la voz y la velocidad).
name: Renderizar videos

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'Qué videos renderizar (ej: 01,04,10) o "todos"'
        default: todos
      voz:
        description: 'Voz de Edge TTS'
        default: es-CO-GonzaloNeural
      velocidad:
        description: 'Velocidad de la voz (ej: +22%, +10%, +0%)'
        default: '+22%'
  push:
    branches: [main]
    paths:
      - 'remotion/shorts/**'
      - 'remotion/src/**'
      - 'remotion/audio/**'
      - 'remotion/scripts/**'
      - 'remotion/package.json'
      - 'videos/config.js'
      - '.github/workflows/videos.yml'

permissions:
  contents: write

concurrency:
  group: renderizar-videos
  cancel-in-progress: true

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.l.outputs.ids }}
    steps:
      - id: l
        run: |
          v="${{ github.event.inputs.videos || 'todos' }}"
          if [ "$v" = "todos" ]; then v="01,02,03,04,05,06,07,08,09,10"; fi
          echo "ids=$(echo "$v" | jq -Rc 'gsub(" ";"") | split(",")')" >> "$GITHUB_OUTPUT"

  render:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.lista.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remotion
            videos/config.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ffmpeg, dependencias y el navegador de Remotion
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          pip install -q edge-tts numpy soundfile scipy num2words
          cd remotion && npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Renderizar ${{ matrix.id }}
        env:
          VOZ_MOTOR: edge
          VOZ_EDGE: ${{ github.event.inputs.voz || 'es-CO-GonzaloNeural' }}
          VOZ_RATE: ${{ github.event.inputs.velocidad || '+22%' }}
          CONCURRENCIA: '4'
        run: cd remotion && node scripts/render.mjs ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.id }}
          path: videos/render/${{ matrix.id }}.mp4
          retention-days: 14

  publicar:
    needs: render
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          merge-multiple: true
          path: videos/render
      - name: Subir los videos al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/render/*.mp4
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Videos renderizados con Remotion y voz ${{ github.event.inputs.voz || 'es-CO-GonzaloNeural' }} [skip ci]"
          # se suben a la misma rama desde la que se corrió el workflow (main o una rama de trabajo)
          rama="${{ github.ref_name }}"
          for i in 1 2 3; do git pull --rebase -q origin "$rama" && git push -q origin "HEAD:$rama" && break; sleep 5; done
